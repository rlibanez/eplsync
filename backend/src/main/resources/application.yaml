spring:
  application:
    name: eplsync

  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 129MB

  datasource:
    url: jdbc:sqlite:./data/eplsync.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

server:
  # Configuración avanzada para despliegues detrás de un proxy inverso.
  # none ignora las cabeceras reenviadas; native permite que Tomcat interprete
  # X-Forwarded-Proto y X-Forwarded-For desde los proxies de confianza.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${EPLSYNC_SECURITY_REQUIRE_HTTPS:false}
  port: 8088
  tomcat:
    remoteip:
      # Expresión regular de las IP de proxies internos de confianza (modo native).
      # Por defecto, solo loopback. Ajustar a la IP del proxy si está en otro
      # contenedor/equipo; no dejar vacío ni confiar en clientes arbitrarios.
      internal-proxies: '127[.]0[.]0[.]1|::1'
    accesslog:
      enabled: true
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      encoding: UTF-8
      pattern: '%{yyyy-MM-dd HH:mm:ss.SSS XXX}t %a "%m %U%q" %s %{ms}Tms %BB "%{User-Agent}i"'
      buffered: false
      rotate: true
      rename-on-rotate: true
      file-date-format: .yyyyMMdd
      max-days: 30

logging:
  file:
    name: ./logs/eplsync.log

  logback:
    rollingpolicy:
      file-name-pattern: ./logs/eplsync.%d{yyyyMMdd}.%i.log
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: true

  level:
    root: INFO
    # HTTP transport debug/wire logs may contain signed download URLs or response bodies.
    org.apache.hc.client5.http: WARN
    org.apache.hc.client5.http.wire: OFF
    org.apache.hc.client5.http.headers: OFF
    org.apache.hc.core5.http: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    com.rlibanez.eplsync: DEBUG

# Valores de instalación. Para catálogo, portadas, torrent y eventos,
# los ajustes guardados desde la interfaz tienen prioridad.
# Restaurar valores de instalación elimina las personalizaciones del apartado.
eplsync:
  security:
    # Opcional: autoriza la creación del primer administrador. Generar: openssl rand -hex 16
    initial-admin-key: ${EPLSYNC_INITIAL_ADMIN_KEY:}
    # Clave AES-256: 32 bytes en Base64 estándar. Generar con: openssl rand -base64 32
    secret-key: ${EPLSYNC_SECRET_KEY:}
    password-min-length: ${EPLSYNC_SECURITY_PASSWORD_MIN_LENGTH:8}
    # Exige HTTPS y marca la cookie de sesión como Secure; no configura TLS.
    require-https: ${EPLSYNC_SECURITY_REQUIRE_HTTPS:false}
  events:
    retention:
      max-count: 10000
      max-age-days: 365
  catalog:
    zip-url: "https://epublibre.org/rssweb/csv/epub.zip"
    import:
      retention: 24h # Conservación del único ZIP guardado desde su descarga/carga.
    cover-check:
      # Debe cumplirse connect-timeout ≤ request-timeout ≤ batch-timeout:
      connect-timeout: 3s # Límite para establecer una conexión HTTP.
      request-timeout: 3s # Presupuesto por URL, incluyendo sus redirecciones.
      batch-timeout: 4s # Límite total del grupo paralelo. >= request-timeout.
      concurrency: 4 # URLs simultáneas (1–32).

  torrent:
    trackers:
      - "udp://tracker.opentrackr.org:1337/announce"
      - "udp://www.torrent.eu.org:451/announce"
      - "udp://exodus.desync.com:6969/announce"
      - "udp://p4p.arenabg.ch:1337/announce"
      - "udp://tracker.internetwarriors.net:1337/announce"
    enabled: false
    client: qbittorrent
    base-url: "http://qbittorrent:8090"
    connect-timeout: 5s
    request-timeout: 10s

    bulk:
      multiple-hashes: all
      batch-size: 100
      concurrency: 1
      interval: 500ms

    download:
      start: true
      save-path: null

    rename:
      enabled: true
      pattern: "{author} - {title} [{eplId}] (r{revision})"

    qbittorrent:
      download:
        category: "Libros"
        tags: ["EPLsync", "{language}"]
        auto-management: true
      auth:
        mode: auto
        api-key: ""
        username: ""
        password: ""
