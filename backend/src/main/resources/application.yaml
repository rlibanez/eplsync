spring:
  application:
    name: eplsync

  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 129MB

  datasource:
    url: jdbc:sqlite:./data/eplsync.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true

server:
  port: 8088
  tomcat:
    accesslog:
      enabled: true
      directory: ${user.dir}/logs
      prefix: access
      suffix: .log
      encoding: UTF-8
      pattern: '%{yyyy-MM-dd HH:mm:ss.SSS XXX}t %a "%m %U%q" %s %{ms}Tms %BB "%{User-Agent}i"'
      buffered: false
      rotate: true
      rename-on-rotate: true
      file-date-format: .yyyyMMdd
      max-days: 30

logging:
  file:
    name: ./logs/eplsync.log

  logback:
    rollingpolicy:
      file-name-pattern: ./logs/eplsync.%d{yyyyMMdd}.%i.log
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: true

  level:
    root: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    com.rlibanez.eplsync: DEBUG

# Valores de instalación. Los ajustes guardados desde la interfaz tienen prioridad.
# Restaurar valores de instalación elimina las personalizaciones del apartado.
eplsync:
  events:
    retention:
      max-count: 10000
      max-age-days: 365
  catalog:
    zip-url: "https://epublibre.org/rssweb/csv/epub.zip"
    import:
      retention: 24h # Conservación del único ZIP guardado desde su descarga/carga.
    cover-check:
      # Debe cumplirse connect-timeout ≤ request-timeout ≤ batch-timeout:
      connect-timeout: 3s # Límite para establecer una conexión HTTP.
      request-timeout: 3s # Presupuesto por URL, incluyendo sus redirecciones.
      batch-timeout: 4s # Límite total del grupo paralelo. >= request-timeout.
      concurrency: 4 # URLs simultáneas (1–32).

  torrent:
    trackers:
      - "udp://tracker.opentrackr.org:1337/announce"
      - "udp://www.torrent.eu.org:451/announce"
      - "udp://exodus.desync.com:6969/announce"
      - "udp://p4p.arenabg.ch:1337/announce"
      - "udp://tracker.internetwarriors.net:1337/announce"
    enabled: false
    client: qbittorrent
    base-url: "http://qbittorrent:8090"
    connect-timeout: 5s
    request-timeout: 10s

    bulk:
      multiple-hashes: all
      batch-size: 100
      concurrency: 1
      interval: 500ms

    download:
      start: true
      save-path: null

    rename:
      enabled: true
      pattern: "{author} - {title} [{eplId}] (r{revision})"

    qbittorrent:
      download:
        category: "Libros"
        tags: ["EPLsync", "{language}"]
        auto-management: true
      auth:
        mode: auto
        api-key: ""
        username: ""
        password: ""
