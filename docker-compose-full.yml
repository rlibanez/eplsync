# Configuración completa. Ejecutar con docker compose -f docker-compose-full.yml up -d --build.
services:
  eplsync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"
    image: rlibanez/eplsync:0.0.1
    container_name: eplsync
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8088}:8088"
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "${LOGS_DIR:-./logs}:/app/logs"
    environment:
      TZ: "${TZ:-Europe/Madrid}"
      EPLSYNC_SECRET_KEY: "${EPLSYNC_SECRET_KEY:-}"

      # Interfaz

      # Seguridad
      EPLSYNC_INITIAL_ADMIN_KEY: "${EPLSYNC_INITIAL_ADMIN_KEY:-}"
      EPLSYNC_SECURITY_REQUIRE_HTTPS: "${EPLSYNC_SECURITY_REQUIRE_HTTPS:-false}"
      EPLSYNC_SECURITY_PASSWORD_MIN_LENGTH: "${EPLSYNC_SECURITY_PASSWORD_MIN_LENGTH:-8}"

      # Catálogo e importaciones
      EPLSYNC_CATALOG_ZIPURL: "${EPLSYNC_CATALOG_ZIPURL:-https://epublibre.org/rssweb/csv/epub.zip}"
      EPLSYNC_CATALOG_IMPORT_OPERATION_TIMEOUT: "${EPLSYNC_CATALOG_IMPORT_OPERATION_TIMEOUT:-30m}"
      EPLSYNC_CATALOG_IMPORT_RETENTION: "${EPLSYNC_CATALOG_IMPORT_RETENTION:-24h}"

      # Comprobación de portadas
      EPLSYNC_CATALOG_COVERCHECK_CONNECTTIMEOUT: "${EPLSYNC_CATALOG_COVERCHECK_CONNECTTIMEOUT:-3s}"
      EPLSYNC_CATALOG_COVERCHECK_REQUESTTIMEOUT: "${EPLSYNC_CATALOG_COVERCHECK_REQUESTTIMEOUT:-3s}"
      EPLSYNC_CATALOG_COVERCHECK_BATCHTIMEOUT: "${EPLSYNC_CATALOG_COVERCHECK_BATCHTIMEOUT:-4s}"
      EPLSYNC_CATALOG_COVERCHECK_CONCURRENCY: "${EPLSYNC_CATALOG_COVERCHECK_CONCURRENCY:-4}"

      # Conexión con el cliente torrent
      EPLSYNC_TORRENT_ENABLED: "${EPLSYNC_TORRENT_ENABLED:-false}"
      EPLSYNC_TORRENT_CLIENT: "${EPLSYNC_TORRENT_CLIENT:-qbittorrent}"
      EPLSYNC_TORRENT_BASEURL: "${EPLSYNC_TORRENT_BASEURL:-http://qbittorrent:8090}"
      EPLSYNC_TORRENT_CONNECTTIMEOUT: "${EPLSYNC_TORRENT_CONNECTTIMEOUT:-5s}"
      EPLSYNC_TORRENT_REQUESTTIMEOUT: "${EPLSYNC_TORRENT_REQUESTTIMEOUT:-10s}"
      EPLSYNC_TORRENT_MAX_RESPONSE_SIZE: "${EPLSYNC_TORRENT_MAX_RESPONSE_SIZE:-256MB}"
      EPLSYNC_TORRENT_MAX_REMOTE_TORRENTS: "${EPLSYNC_TORRENT_MAX_REMOTE_TORRENTS:-500000}"

      # Autenticación de qBittorrent
      EPLSYNC_TORRENT_QBITTORRENT_AUTH_MODE: "${EPLSYNC_TORRENT_QBITTORRENT_AUTH_MODE:-auto}"
      EPLSYNC_TORRENT_QBITTORRENT_AUTH_USERNAME: "${EPLSYNC_TORRENT_QBITTORRENT_AUTH_USERNAME:-}"
      EPLSYNC_TORRENT_QBITTORRENT_AUTH_PASSWORD: "${EPLSYNC_TORRENT_QBITTORRENT_AUTH_PASSWORD:-}"
      EPLSYNC_TORRENT_QBITTORRENT_AUTH_APIKEY: "${EPLSYNC_TORRENT_QBITTORRENT_AUTH_APIKEY:-}"

      # Trackers
      EPLSYNC_TORRENT_TRACKERS: "${EPLSYNC_TORRENT_TRACKERS-udp://tracker.opentrackr.org:1337/announce,udp://www.torrent.eu.org:451/announce,udp://exodus.desync.com:6969/announce,udp://p4p.arenabg.ch:1337/announce,udp://tracker.internetwarriors.net:1337/announce}"

      # Trabajos de descargas
      EPLSYNC_TORRENT_BULK_MULTIPLEHASHES: "${EPLSYNC_TORRENT_BULK_MULTIPLEHASHES:-all}"
      EPLSYNC_TORRENT_BULK_BATCHSIZE: "${EPLSYNC_TORRENT_BULK_BATCHSIZE:-100}"
      EPLSYNC_TORRENT_BULK_CONCURRENCY: "${EPLSYNC_TORRENT_BULK_CONCURRENCY:-1}"
      EPLSYNC_TORRENT_BULK_INTERVAL: "${EPLSYNC_TORRENT_BULK_INTERVAL:-500ms}"

      # Retención de trabajos finalizados
      EPLSYNC_TORRENT_BULK_RETENTION_ENABLED: "${EPLSYNC_TORRENT_BULK_RETENTION_ENABLED:-true}"
      EPLSYNC_TORRENT_BULK_RETENTION_DAYS: "${EPLSYNC_TORRENT_BULK_RETENTION_DAYS:-90}"
      EPLSYNC_TORRENT_BULK_RETENTION_INTERVAL: "${EPLSYNC_TORRENT_BULK_RETENTION_INTERVAL:-1h}"

      # Limpieza diferida de revisiones
      EPLSYNC_TORRENT_CLEANUP_ENABLED: "${EPLSYNC_TORRENT_CLEANUP_ENABLED:-true}"
      EPLSYNC_TORRENT_CLEANUP_INTERVAL: "${EPLSYNC_TORRENT_CLEANUP_INTERVAL:-30s}"
      EPLSYNC_TORRENT_CLEANUP_BATCH_SIZE: "${EPLSYNC_TORRENT_CLEANUP_BATCH_SIZE:-100}"

      # Opciones de envío al cliente torrent
      EPLSYNC_TORRENT_DOWNLOAD_START: "${EPLSYNC_TORRENT_DOWNLOAD_START:-true}"
      EPLSYNC_TORRENT_DOWNLOAD_SAVEPATH: "${EPLSYNC_TORRENT_DOWNLOAD_SAVEPATH-}"
      EPLSYNC_TORRENT_RENAME_ENABLED: "${EPLSYNC_TORRENT_RENAME_ENABLED:-true}"
      EPLSYNC_TORRENT_RENAME_PATTERN: "${EPLSYNC_TORRENT_RENAME_PATTERN:-{author} - {title} [{eplId}] (r{revision})}"
      EPLSYNC_TORRENT_QBITTORRENT_DOWNLOAD_CATEGORY: "${EPLSYNC_TORRENT_QBITTORRENT_DOWNLOAD_CATEGORY-Libros}"
      EPLSYNC_TORRENT_QBITTORRENT_DOWNLOAD_TAGS: "${EPLSYNC_TORRENT_QBITTORRENT_DOWNLOAD_TAGS-EPLsync,{language}}"
      EPLSYNC_TORRENT_QBITTORRENT_DOWNLOAD_AUTOMANAGEMENT: "${EPLSYNC_TORRENT_QBITTORRENT_DOWNLOAD_AUTOMANAGEMENT:-true}"

      # Retención del registro de eventos
      EPLSYNC_EVENTS_RETENTION_MAXCOUNT: "${EPLSYNC_EVENTS_RETENTION_MAX_COUNT:-10000}"
      EPLSYNC_EVENTS_RETENTION_MAXAGEDAYS: "${EPLSYNC_EVENTS_RETENTION_MAX_AGE_DAYS:-365}"
    stop_grace_period: 30s
    restart: unless-stopped
