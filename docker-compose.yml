services:
  eplsync:
    image: ghcr.io/rlibanez/eplsync:1.0.0-rc.2
    user: "${PUID:-1000}:${PGID:-1000}"
    container_name: eplsync
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8088}:8088"
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "${LOGS_DIR:-./logs}:/app/logs"
    environment:
      TZ: "${TZ:-Europe/Madrid}"
      EPLSYNC_SECRET_KEY: "${EPLSYNC_SECRET_KEY:-}"
    stop_grace_period: 30s
    restart: unless-stopped
